services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    env_file: ./backend/.env
    environment:
      PYTHONPATH: /app
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_MODE: ${DB_MODE:-socket}        # local | socket | remote
    volumes:
      - vectorstore:/app/data           # named volume — survives container updates
      #- ${MYSQL_SOCKET_PATH:-/tmp/fake.sock}:/var/run/mysqld/mysqld.sock
      - /var/run/mysqld/mysqld.sock:/var/run/mysqld/mysqld.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"                          # internal only; nginx talks to it
    networks:
      - app-net
    restart: always
    healthcheck:
      # Checks DB reachability (TCP or socket) depending on DB_MODE,
      # then confirms FastAPI is up. torch + chroma cold-start is slow.
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import socket, sys, os
          mode = os.environ.get('DB_MODE', 'local')
          if mode == 'socket':
              sock = os.environ.get('MYSQL_SOCKET_PATH', '/var/run/mysqld/mysqld.sock')
              if not os.path.exists(sock):
                  print(f"Socket not found: {sock}")
                  sys.exit(1)
          else:
              host = os.environ.get('DB_HOST', '127.0.0.1')
              port = int(os.environ.get('DB_PORT', 3306))
              try:
                  s = socket.create_connection((host, port), timeout=5)
                  s.close()
              except Exception as e:
                  print(f"DB unreachable: {e}")
                  sys.exit(1)
          import urllib.request
          try:
              urllib.request.urlopen('http://localhost:8000/', timeout=5)
          except Exception as e:
              print(f"FastAPI not ready: {e}")
              sys.exit(1)
          sys.exit(0)
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s                 # model load (torch + chroma) takes time


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:                          # ADD THIS
        - VITE_API_URL=/api
    ports:
      - "8004:80"                       # host:8002 → container nginx:80
    depends_on:
      backend:
        condition: service_healthy      # nginx won't start until backend is ready
    networks:
      - app-net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vectorstore:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data                    # binds to repo's data/ folder on host

networks:
  app-net:
    driver: bridge

