server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Trust forwarded headers from host Nginx ───────────────────────────────
    # Safe because nothing external can reach this container directly —
    # port 8088 should be firewalled to localhost only on the VPS.
    real_ip_header     X-Forwarded-For;
    set_real_ip_from   127.0.0.1;        # host Nginx runs on the same machine

    # ── /api → FastAPI backend ────────────────────────────────────────────────
    # Strips /api prefix; FastAPI keeps its existing routes (/chat, /, etc.)
    location /api/ {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $http_x_forwarded_proto;

        # Match Hestia panel timeouts so the chain never cuts before FastAPI responds
        proxy_connect_timeout 900s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;

        # Fallback — JSON 503 instead of Nginx's default HTML error page
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"error":"Backend service unavailable. Please try again later."}';
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    # X-Frame-Options and nosniff only — don't set HSTS here, let host Nginx own it
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
}
