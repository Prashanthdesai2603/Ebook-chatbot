# docker/nginx/nginx.conf
# Used only by the PROD frontend container (Nginx serves the Vite build).
# In DEV the Vite dev server proxy (frontend/vite.config.js) handles /api.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── /api → FastAPI ────────────────────────────────────────────────────────
    # Strips /api prefix; FastAPI receives /chat, /, etc. unchanged.
    location /api/ {
        proxy_pass            http://backend:8000/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;  # LLM responses can be slow
        proxy_connect_timeout 10s;

        # Fallback — returns a JSON 503 instead of Nginx's default HTML error
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"error":"Backend service unavailable. Please try again later."}';
    }

    # ── SPA fallback (React Router / client-side routing) ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
}
