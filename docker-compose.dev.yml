# Hot-reload for both services. Source is mounted as volumes — no rebuild needed
# for code changes (backend auto-reloads via uvicorn, frontend via Vite HMR).
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml down

services:

  backend:
    build:
      context: .                         # repo root — needs ai/ + backend/
      dockerfile: backend/Dockerfile
      target: dev
    env_file: ./backend/.env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend           # live-reload backend source
      - ./ai:/app/ai                     # live-reload ai source
      - ./data:/app/data                 # vectorstore + ebooks persist on host
    ports:
      - "8000:8000"                      # exposed for direct curl / testing
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      # Polls the root endpoint — only passes once the model is loaded and
      # FastAPI is serving. interval is generous because torch/chroma startup can take 30-60 s on first run.
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s                  # give model load time before first check

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    volumes:
      - ./frontend/src:/app/src          # Vite HMR picks up changes instantly
      - ./frontend/public:/app/public
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy       # waits for backend healthcheck to pass
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  app-net:
    driver: bridge
